<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>بوابة مشروع التخرج</title>

  <style>
    html, body { margin: 0; height: 100%; }

           font-family: "Segoe UI", Tahoma, Arial, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }

    p { margin: 0 0 20px; opacity: .75; }
    a { display: inline-block; background: #0F766E; color: #fff; text-decoration: none;
